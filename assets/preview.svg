<!-- 同时声明 xlink 命名空间：<use> 的 href 在新旧渲染器上都能解析 -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="二次元壁纸主题 · 效果预览">
  <title>二次元壁纸主题 · 效果预览</title>
  <desc>整图按 contain 完整可见，两侧留白用同一张图的模糊放大版晕染，正片边缘做渐隐羽化</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b267"/>
      <stop offset="0.42" stop-color="#e8846b"/>
      <stop offset="1" stop-color="#6c5b9e"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080a10" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#080a10" stop-opacity="0.50"/>
    </linearGradient>
    <!-- 正片边缘的羽化蒙版：位置按图的实际渲染矩形算（这里 = 288~672，羽化宽 84） -->
    <linearGradient id="featherGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.212" stop-color="#000"/>
      <stop offset="0.388" stop-color="#fff"/>
      <stop offset="0.612" stop-color="#fff"/>
      <stop offset="0.788" stop-color="#000"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="feather" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="540">
      <rect width="960" height="540" fill="url(#featherGrad)"/>
    </mask>
    <filter id="blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="288" y="0" width="384" height="540"/>
    </clipPath>
  </defs>

  
  <g id="scene">
    <rect width="384" height="540" fill="url(#sky)"/>
    <circle cx="192" cy="176" r="86" fill="#fff3c4" opacity="0.30"/>
    <circle cx="192" cy="176" r="58" fill="#ffe9a8" opacity="0.92"/>
    <g fill="#ffffff" opacity="0.34">
      <ellipse cx="104" cy="128" rx="58" ry="14"/>
      <ellipse cx="146" cy="118" rx="38" ry="11"/>
      <ellipse cx="286" cy="212" rx="52" ry="12"/>
      <ellipse cx="318" cy="204" rx="32" ry="9"/>
    </g>
    <path d="M0 372 L86 296 L150 350 L214 292 L292 366 L384 320 L384 540 L0 540 Z" fill="#5b4a8a" opacity="0.78"/>
    <path d="M0 418 L74 356 L142 410 L228 348 L300 404 L384 366 L384 540 L0 540 Z" fill="#3d3566" opacity="0.92"/>
    <path d="M0 470 L96 424 L188 470 L286 428 L384 476 L384 540 L0 540 Z" fill="#241f42"/>
    <rect y="500" width="384" height="40" fill="#171430"/>
    <g fill="#ffe9a8" opacity="0.55">
      <rect x="176" y="504" width="32" height="3" rx="1.5"/>
      <rect x="158" y="512" width="68" height="2.5" rx="1.25"/>
      <rect x="140" y="520" width="104" height="2.5" rx="1.25"/>
    </g>
  </g>

  <!-- 兜底色 -->
  <rect width="960" height="540" fill="#0b0d12"/>

  <!-- ① 铺底：同一张图 cover 到整屏 + 大半径虚化 —— 留白处由它接管，所以不会出现白块黑块 -->
  <g transform="scale(2.5) translate(0,-162)" filter="url(#blur)">
    <g opacity="0.95"><use href="#scene" xlink:href="#scene"/></g>
  </g>

  <!-- ② 正片：按 contain 完整可见，左右边缘用羽化蒙版渐隐，和铺底无缝衔接 -->
  <g mask="url(#feather)" clip-path="url(#photoClip)">
    <use href="#scene" xlink:href="#scene" x="288"/>
  </g>

  <!-- ③ 幕色：跟随主题明暗（此处为深色主题），保证浅色文字也压得住 -->
  <rect width="960" height="540" fill="url(#veil)"/>

  <!-- 应用界面：侧栏（实底） -->
  <rect width="196" height="540" fill="#14161c" opacity="0.94"/>
  <rect x="20" y="26" width="30" height="30" rx="9" fill="#6d8dff" opacity="0.9"/>
  <rect x="60" y="34" width="76" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
  <rect x="60" y="47" width="48" height="6" rx="3" fill="#ffffff" opacity="0.28"/>
  <rect x="14" y="86" width="168" height="34" rx="10" fill="#ffffff" opacity="0.10"/>
  <rect x="30" y="99" width="86" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
  <g opacity="0.34">
    <rect x="30" y="146" width="96" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="30" y="186" width="70" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="30" y="226" width="110" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="30" y="266" width="82" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="30" y="306" width="120" height="7" rx="3.5" fill="#ffffff"/>
  </g>
  <rect x="14" y="492" width="168" height="30" rx="9" fill="#ffffff" opacity="0.08"/>

  <!-- 应用界面：对话区（正文压在图与幕色之上） -->
  <g opacity="0.62">
    <rect x="236" y="48" width="430" height="11" rx="5.5" fill="#ffffff" opacity="0.44"/>
    <rect x="236" y="70" width="330" height="11" rx="5.5" fill="#ffffff" opacity="0.30"/>
    <rect x="236" y="102" width="268" height="26" rx="8" fill="#ffffff" opacity="0.13"/>
    <rect x="246" y="111" width="186" height="9" rx="4.5" fill="#ffffff" opacity="0.42"/>
    <rect x="236" y="148" width="470" height="11" rx="5.5" fill="#ffffff" opacity="0.34"/>
    <rect x="236" y="170" width="392" height="11" rx="5.5" fill="#ffffff" opacity="0.24"/>
  </g>

  <!-- 右下角控制坞：可拖动、空闲半透明 -->
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <rect x="676" y="466" width="272" height="42" rx="21" fill="#14161c" opacity="0.86"/>
    <rect x="676" y="466" width="272" height="42" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="700" cy="487" r="4.5" fill="#33d17a"/>
    <text x="716" y="492" font-size="13" fill="#f2f4f8">二次元壁纸</text>
    <rect x="790" y="475" width="56" height="24" rx="8" fill="#ffffff" opacity="0.12"/>
    <text x="818" y="492" font-size="12" text-anchor="middle" fill="#f2f4f8" opacity="0.92">换一张</text>
    <rect x="852" y="475" width="28" height="24" rx="8" fill="#ffffff" opacity="0.12"/>
    <text x="866" y="492" font-size="12" text-anchor="middle" fill="#f2f4f8" opacity="0.92">开</text>
    <rect x="886" y="475" width="52" height="24" rx="8" fill="#ffffff" opacity="0.12"/>
    <text x="912" y="492" font-size="12" text-anchor="middle" fill="#f2f4f8" opacity="0.92">设置</text>
  </g>

  <!-- 说明：把这张图在演示什么写清楚 -->
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">
    <text x="28" y="516" fill="#ffffff" opacity="0.50">正片 contain 完整可见</text>
    <text x="28" y="532" fill="#ffffff" opacity="0.34">两侧 = 同图模糊放大铺底 · 边缘羽化衔接</text>
    <text x="932" y="532" text-anchor="end" fill="#ffffff" opacity="0.34">图源 cnmiw.com (MirlKoi API)</text>
  </g>
</svg>
